<!-- Caricare prima Bootstrap 5 e il client Wacom. -->
<script src="/js/wacom-stu-client.js"></script>

<div class="modal fade" id="mod_scheda_firma_elettronica" tabindex="-1"
     aria-labelledby="titolo_scheda_firma_elettronica" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="titolo_scheda_firma_elettronica">
          Documento da firmare
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"
                aria-label="Chiudi"></button>
      </div>

      <div class="modal-body">
        <!-- Funziona con PDF e con pagine HTML visualizzabili in iframe. -->
        <iframe id="anteprima_documento_firma"
                title="Anteprima del documento da firmare"
                style="width:100%;height:58vh;border:1px solid #dee2e6;border-radius:.375rem">
        </iframe>

        <div id="stato_firma_elettronica" class="alert alert-info mt-3 mb-0" role="status">
          Preparazione della tavoletta…
        </div>

        <div id="contenitore_anteprima_firma" class="mt-3 d-none">
          <div class="fw-semibold mb-2">Firma acquisita</div>
          <canvas id="anteprima_tratto_firma" width="800" height="480"
                  style="width:100%;height:auto;border:1px solid #dee2e6;border-radius:.375rem">
          </canvas>
        </div>

        <!-- Da inviare al backend insieme al normale form della pratica/referto. -->
        <input type="hidden" id="punti_firma_elettronica" name="punti_firma_elettronica">
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
        <button type="button" class="btn btn-primary" id="ripeti_firma_elettronica">
          Ripeti acquisizione
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let acquisizioneFirmaInCorso = false;
  let ultimaFirmaElettronica = null;

  function impostaStatoFirma(tipo, messaggio) {
    const stato = document.getElementById('stato_firma_elettronica');
    stato.className = `alert alert-${tipo} mt-3 mb-0`;
    stato.textContent = messaggio;
  }

  async function acquisisciFirmaElettronica() {
    if (acquisizioneFirmaInCorso) return;
    acquisizioneFirmaInCorso = true;

    const ripeti = document.getElementById('ripeti_firma_elettronica');
    ripeti.disabled = true;
    impostaStatoFirma('info', 'Apporre la firma sulla tavoletta e premere OK…');

    try {
      const firma = await WacomStu.capture();
      ultimaFirmaElettronica = firma;

      // Il JSON conserva tutti i dati originali restituiti dal bridge.
      document.getElementById('punti_firma_elettronica').value = JSON.stringify(firma);

      WacomStu.draw(document.getElementById('anteprima_tratto_firma'), firma);
      document.getElementById('contenitore_anteprima_firma').classList.remove('d-none');
      impostaStatoFirma('success', 'Firma correttamente acquisita');

      // Qui è possibile richiamare il salvataggio AJAX dell'applicazione.
      document.dispatchEvent(new CustomEvent('wacom:firma-acquisita', {detail: firma}));
    } catch (errore) {
      impostaStatoFirma(
        errore.cancelled ? 'warning' : 'danger',
        errore.cancelled ? 'Acquisizione annullata' : `Errore Wacom: ${errore.message}`
      );
    } finally {
      acquisizioneFirmaInCorso = false;
      ripeti.disabled = false;
    }
  }

  function apriSchedaFirmaElettronica(url) {
    const elementoModale = document.getElementById('mod_scheda_firma_elettronica');
    const modale = bootstrap.Modal.getOrCreateInstance(elementoModale);

    document.getElementById('anteprima_documento_firma').src = url;
    document.getElementById('punti_firma_elettronica').value = '';
    document.getElementById('contenitore_anteprima_firma').classList.add('d-none');
    ultimaFirmaElettronica = null;
    impostaStatoFirma('info', 'Preparazione della tavoletta…');

    // L'acquisizione parte soltanto dopo che Bootstrap ha aperto la modale.
    elementoModale.addEventListener('shown.bs.modal', acquisisciFirmaElettronica, {once: true});
    modale.show();
  }

  document.getElementById('ripeti_firma_elettronica')
    .addEventListener('click', acquisisciFirmaElettronica);

  // Evita che un PDF precedente resti caricato dopo la chiusura.
  document.getElementById('mod_scheda_firma_elettronica')
    .addEventListener('hidden.bs.modal', () => {
      document.getElementById('anteprima_documento_firma').src = 'about:blank';
    });
</script>
